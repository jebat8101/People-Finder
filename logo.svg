<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="People Finder">
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- network arcs -->
  <path d="M110 150 Q256 40 402 150" fill="none" stroke="#c5d0db" stroke-width="3" stroke-dasharray="4 6"/>
  <path d="M130 175 Q256 70 382 175" fill="none" stroke="#d7e0e8" stroke-width="2"/>

  <!-- platform icons -->
  <g font-family="system-ui,Segoe UI,sans-serif" font-weight="700" font-size="22" text-anchor="middle" dominant-baseline="central">
    <!-- X -->
    <circle cx="108" cy="148" r="28" fill="#111111"/>
    <text x="108" y="149" fill="#ffffff" font-size="20">5O</text>
    <!-- Facebook -->
    <circle cx="168" cy="98" r="28" fill="#1877F2"/>
    <text x="168" y="100" fill="#ffffff" font-size="26">f</text>
    <!-- Instagram -->
    <defs>
      <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f58529"/>
        <stop offset="50%" stop-color="#dd2a7b"/>
        <stop offset="100%" stop-color="#8134af"/>
      </linearGradient>
    </defs>
    <circle cx="256" cy="78" r="28" fill="url(#ig)"/>
    <rect x="243" y="65" width="26" height="26" rx="7" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="256" cy="78" r="7" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="266" cy="68" r="2" fill="#fff"/>
    <!-- TikTok -->
    <circle cx="344" cy="98" r="28" fill="#111111"/>
    <path d="M338 86 v20 c0 8 6 12 12 12 5 0 9-3 9-9" fill="none" stroke="#25F4EE" stroke-width="4" stroke-linecap="round"/>
    <path d="M342 86 v20 c0 8 6 12 12 12 5 0 9-3 9-9" fill="none" stroke="#FE2C55" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <path d="M340 86 c8-2 14-8 16-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <!-- Reddit -->
    <circle cx="404" cy="148" r="28" fill="#FF4500"/>
    <circle cx="404" cy="152" r="12" fill="#fff"/>
    <circle cx="399" cy="150" r="2.2" fill="#111"/>
    <circle cx="409" cy="150" r="2.2" fill="#111"/>
    <circle cx="416" cy="140" r="3.5" fill="#fff"/>
    <path d="M404 140 v-8 h8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Google -->
    <circle cx="430" cy="210" r="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <text x="430" y="212" fill="#4285F4" font-size="28">G</text>
  </g>

  <!-- background people -->
  <g fill="#7eb6e0" opacity="0.85">
    <circle cx="175" cy="230" r="28"/>
    <path d="M140 300 c0-28 16-48 35-48 s35 20 35 48"/>
    <circle cx="330" cy="228" r="28"/>
    <path d="M295 300 c0-28 16-48 35-48 s35 20 35 48"/>
  </g>

  <!-- magnifying glass -->
  <g>
    <circle cx="248" cy="245" r="92" fill="#ffffff" stroke="#1e6bb8" stroke-width="18"/>
    <circle cx="248" cy="245" r="78" fill="#eaf4fb"/>
    <circle cx="248" cy="222" r="28" fill="#163a5f"/>
    <path d="M198 310 c8-42 28-62 50-62 s42 20 50 62" fill="#163a5f"/>
    <rect x="318" y="318" width="26" height="90" rx="13" fill="#1e6bb8" transform="rotate(45 331 363)"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="430" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-weight="800" font-size="42" fill="#0b2a3e">People</text>
  <defs>
    <linearGradient id="finderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5dade2"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
  </defs>
  <text x="256" y="480" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-weight="800" font-size="42" fill="url(#finderGrad)">Finder</text>
</svg>
